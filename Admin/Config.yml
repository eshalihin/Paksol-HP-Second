backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "produk"
    label: "Katalog HP"
    folder: "content/produk"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Nama HP", name: "title", widget: "string"}
      - {label: "Status Stok", name: "status", widget: "select", options: ["Ready", "Terjual"]}
      - {label: "Harga", name: "harga", widget: "string"}
      - {label: "Foto Utama", name: "thumbnail", widget: "image"}
      - {label: "Spesifikasi Ringkas", name: "spesifikasi", widget: "text"}
